name: vscode-python-opt
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pip
  - pip:
    - typer>=0.27.1
    - cplex>=22.2.0.1
    - docplex>=2.32.264
    - gurobipy>=13.0.2
    - highspy>=1.15.1
    - mip>=2.0.0
    - cffi>=2.0.0   # Ensures mip builds successfully on Windows
    - ortools>=9.15.6755
    - pychoco>=0.2.6,<0.3     # Issues with set_input_order_lb_search()
    - PySCIPOpt>=6.2.1
    - xpress>=9.9.1
    # dev dependencies
    - ty>=0.0.73
    - pytest>=9.1.1
    - pytest-cov>=7.1.0
    - ruff>=0.16.4
